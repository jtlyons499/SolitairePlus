# Builds, tests and (for version tags only) publishes Solitaire+ for Windows.
#
#   Pull request / push to main -> test + unsigned build (downloadable artifact, kept 14 days)
#   Push of a tag "vX.Y.Z"      -> test + build + publish a GitHub Release
#
# Never create tags by hand: use tools/release.ps1 (see docs/RELEASING.md).
name: Build Windows Release

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
    tags:
      - "v*"

# Read-only by default. Only the publish job below may write (create the Release).
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running build. Tag builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: Unit tests and asset preflight
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Check tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: python tools/release_helpers.py verify-tag "${{ github.ref_name }}"

      # Same command maintainers run locally. Quarantined tests (tests/KNOWN_FAILURES.txt)
      # are reported but never fail the build; any other failure does.
      - name: Run unit tests
        shell: pwsh
        run: python tools/run_tests.py

      - name: Check game assets (preflight)
        shell: pwsh
        run: python tools/release_preflight.py

  build:
    name: Build Windows package
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Generate Windows version metadata
        shell: pwsh
        run: |
          # Each exe gets the version of its own code (game: version.py, network: netservice/__init__.py).
          # Non-release builds get a "+ci.N" label so they can never be mistaken for an official release.
          if ("${{ github.ref_type }}" -ne "tag") {
            $env:SOLITAIRE_BUILD_NUMBER = "${{ github.run_number }}"
            $env:SOLITAIRE_BUILD_SUFFIX = "+ci.${{ github.run_number }}"
          }
          python tools/write_version_info.py --all

      - name: Build with PyInstaller
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm "SolitairePlus.spec"

      - name: Verify executables
        shell: pwsh
        run: |
          foreach ($exe in "SolitairePlus.exe", "SolitaireNet.exe") {
            $path = "dist\SolitairePlus\$exe"
            if (-not (Test-Path $path)) { throw "Expected executable was not produced: $path" }
            Get-Item $path | Format-List Name, Length, LastWriteTime
          }

      # The multiplayer files ship as loose .py source, so PyInstaller cannot see what they
      # import. This proves every one of them imports inside the real packaged game.
      # A failure usually means "add <module> to hiddenimports in SolitairePlus.spec" (docs/TESTING.md).
      - name: Self-test packaged game and network service
        shell: pwsh
        run: |
          & "dist\SolitairePlus\SolitaireNet.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "SolitaireNet.exe --selftest failed" }
          $env:SDL_VIDEODRIVER = "dummy"; $env:SDL_AUDIODRIVER = "dummy"
          $report = Join-Path $PWD "selftest-multiplayer.txt"
          $p = Start-Process "dist\SolitairePlus\SolitairePlus.exe" -ArgumentList "--multiplayer", "--selftest", "--selftest-report", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Warning "No self-test report was written." }
          if ($p.ExitCode -ne 0) { throw "Packaged multiplayer self-test failed (exit code $($p.ExitCode))" }

      # Tag builds only: reuse the previous release's copy of every part whose source did not
      # change, so players only download what really changed (tools/make_manifest.py).
      - name: Fetch previous release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = "${{ github.ref_name }}"
          $previous = gh release list --repo "${{ github.repository }}" --exclude-pre-releases --exclude-drafts --limit 10 --json tagName --jq ".[].tagName" |
            Where-Object { $_ -ne $current } | Select-Object -First 1
          if (-not $previous) { Write-Host "No previous release."; exit 0 }
          New-Item -ItemType Directory -Force -Path prev | Out-Null
          gh release download $previous --repo "${{ github.repository }}" --pattern manifest.json --pattern Solitaire-Windows.zip --dir prev
          if (-not (Test-Path prev\manifest.json)) {
            Write-Host "Previous release $previous has no manifest.json (made before the updater existed); everything is new."
            Remove-Item prev -Recurse -Force
            exit 0
          }
          Expand-Archive prev\Solitaire-Windows.zip -DestinationPath prev\files -Force
          Write-Host "Previous release: $previous"

      - name: Reuse unchanged parts from the previous release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('prev/manifest.json') != ''
        shell: pwsh
        run: python tools/make_manifest.py reuse --dist dist\SolitairePlus --previous-manifest prev\manifest.json --previous-dir prev\files --rebuilt-out release\rebuilt-exes.txt

      # Preflight scan: detects threats *on this runner only*. It cannot
      # guarantee that a consumer's current Defender cloud model agrees.
      - name: Scan build with Microsoft Defender (if available)
        shell: pwsh
        run: |
          $folder = (Resolve-Path -LiteralPath "dist\SolitairePlus").Path
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($null -eq $status -or -not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            Write-Warning "Defender is unavailable on this runner. No antivirus scan was performed."
          } else {
            Write-Host "Defender enabled. Scanning $folder"
            Start-MpScan -ScanType CustomScan -ScanPath $folder -ErrorAction Stop
            foreach ($exe in "SolitairePlus.exe", "SolitaireNet.exe") {
              if (-not (Test-Path -LiteralPath (Join-Path $folder $exe))) {
                throw "Defender removed or quarantined $exe. Stop publication."
              }
            }
            $detected = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              @($_.Resources) | Where-Object { $_ -like "*$folder*" }
            })
            if ($detected.Count -gt 0) {
              $detected | Format-List ThreatID, ThreatStatusID, Resources
              throw "Defender flagged the build. Stop publication."
            }
            Write-Host "No Defender detection reported by this runner's scan."
          }

      - name: Write manifest and delta
        shell: pwsh
        run: |
          $previous = @()
          if (Test-Path prev\manifest.json) { $previous = @("--previous-manifest", "prev\manifest.json") }
          python tools/make_manifest.py manifest --dist dist\SolitairePlus --out dist\SolitairePlus\manifest.json --delta-dir release @previous
          if ($LASTEXITCODE -ne 0) { throw "Writing the manifest failed" }
          Copy-Item dist\SolitairePlus\manifest.json release\manifest.json

      - name: Create player-ready ZIP and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\Solitaire-Windows" | Out-Null
          Copy-Item -Path "dist\SolitairePlus\*" -Destination "release\Solitaire-Windows" -Recurse -Force
          Copy-Item -Path "README.md" -Destination "release\Solitaire-Windows\README.md" -Force
          Copy-Item -Path "PLAYING.txt" -Destination "release\Solitaire-Windows\PLAYING.txt" -Force
          Compress-Archive -Path "release\Solitaire-Windows\*" -DestinationPath "release\Solitaire-Windows.zip" -Force
          Remove-Item "release\Solitaire-Windows" -Recurse -Force
          Push-Location release
          Get-ChildItem -File -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "SHA256SUMS.txt" -Encoding ASCII
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solitaire-Windows
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Solitaire-Windows
          path: release

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create or update the Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          python tools/release_helpers.py notes $version | Set-Content -Path release-notes.md -Encoding UTF8
          # Players' updaters read manifest.json and the delta/full zips; SHA256SUMS.txt is for people.
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -ne "rebuilt-exes.txt" } | ForEach-Object { $_.FullName })
          $assets | ForEach-Object { Write-Host "Asset: $_" }
          # Versions like 0.0.8-beta.1 are published as pre-releases, which the in-game updater ignores.
          $extra = @()
          if ($version.Contains("-")) { $extra += "--prerelease" }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists (workflow re-run); replacing its files."
            gh release upload $tag @assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag @assets --verify-tag --title "Solitaire+ $tag" --notes-file release-notes.md @extra --repo "${{ github.repository }}"
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }
